<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobHub 任用決策空間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Design tokens 複製自 apollo-enterprise-portal-shell（MAYO UI 3.0 APOLLO Foundations），勿手改 -->
    <script src="/tailwind-theme.js"></script>
    <link rel="stylesheet" href="/theme-vars.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-dark-200); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-dark-400); }

        /* 輕量完成回饋：勾選彈出＋柔和亮起（短暫、不打斷操作） */
        @keyframes jh-check-pop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes jh-glow {
            0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-success) 35%, transparent); }
            100% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--color-success) 0%, transparent); }
        }
        @keyframes jh-rise {
            0% { transform: translateY(4px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .jh-check-pop { animation: jh-check-pop 0.45s ease-out; }
        .jh-glow { animation: jh-glow 1.4s ease-out; }
        .jh-rise { animation: jh-rise 0.3s ease-out; }
        @media (prefers-reduced-motion: reduce) {
            .jh-check-pop, .jh-glow, .jh-rise { animation: none; }
        }
    </style>
</head>
<body class="bg-bg-card text-text-main">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
